name: Lint, test, and build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
      - name: Install dependencies
        run: |
          npm install
      - name: Run lint
        run: |
          npm run lint
      - name: Create issue on failure
        if: failure() 
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: CI lint failed on ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq 'length')

          if [ "$EXISTING" -eq 0 ]; then
            gh issue create --title "$TITLE" --body "Lint впав. Деталі: $RUN_URL"
          else
            echo "Issue вже існує, нове не створюю"
          fi

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
      - name: Install ci dependencies
        run: |
          npm ci
      - name: Run tests
        run: |
          npm test
  build:
    needs: test 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
      - name: Install ci dependencies
        run: |
          npm ci
      - name: Build project
        run: |
          npm run build